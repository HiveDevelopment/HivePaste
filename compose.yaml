services:
  hivepaste:
    build: .
    restart: unless-stopped
    ports:
      - "${HIVEPASTE_BIND:-127.0.0.1:8080}:8080"
    env_file:
      - .env
    environment:
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - hivepaste_database:/var/www/html/database
      - hivepaste_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  hivepaste_database:
  hivepaste_storage:
