name: Tests and assets
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
                - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
      - run: npm install --no-audit --no-fund && npm run build
      - run: test -s public/assets/hivepaste.css && test -s public/assets/hivepaste-editor.js && test -s public/assets/hivepaste-viewer.js
